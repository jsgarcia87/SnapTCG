# Kard Lume · ejemplo de bloque server para Nginx. Ajusta server_name, root y los certificados.
server {
  listen 80;
  server_name kardlume.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name kardlume.example.com;
  root /var/www/kardlume;          # contenido de dist/
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/kardlume.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kardlume.example.com/privkey.pem;

  types { application/manifest+json webmanifest; }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.tcgdex.net https://api.scryfall.com https://api.pokemontcg.io https://rgyoatclhoblugdjekwl.supabase.co wss://rgyoatclhoblugdjekwl.supabase.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://api.frankfurter.dev https://api.frankfurter.app data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location ~* (\.html|/sw\.js|\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.tcgdex.net https://api.scryfall.com https://api.pokemontcg.io https://rgyoatclhoblugdjekwl.supabase.co wss://rgyoatclhoblugdjekwl.supabase.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://api.frankfurter.dev https://api.frankfurter.app data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / { try_files $uri $uri/ =404; }
}
