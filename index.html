<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardDex MVP - Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex flex-col items-center justify-center min-h-screen p-4 font-sans text-white">

    <div class="bg-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-8 border border-slate-700">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                CardDex MVP
            </h1>
            <p class="text-slate-400 text-sm mt-2">Busca o escanea cartas de Pokémon</p>
        </div>

        <div id="card-display" class="relative w-full aspect-[2/3] bg-slate-700 rounded-2xl border-2 border-dashed border-slate-600 flex items-center justify-center mb-6 overflow-hidden shadow-inner">
            <div id="loading-spinner" class="hidden animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            <span id="placeholder-text" class="text-slate-500 text-center px-4">La carta aparecerá aquí cuando busques o escanees</span>
            <img id="card-image" src="" alt="Carta" class="hidden w-full h-full object-contain shadow-2xl" />
        </div>

        <div id="price-result" class="hidden mb-8 text-center animate-bounce">
            <p class="text-slate-400 text-xs uppercase tracking-widest font-bold">Precio Medio (Cardmarket)</p>
            <p id="price-value" class="text-5xl font-black text-emerald-400 mt-1">0.00 €</p>
        </div>

        <div class="space-y-4">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="manual-search" 
                    placeholder="Escribe el nombre (ej. Pikachu)" 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                >
                <button onclick="ejecutarBusqueda()" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl transition-colors">
                    🔍
                </button>
            </div>

            <div class="relative">
                <label for="camera-input" class="flex items-center justify-center w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-4 px-6 rounded-2xl cursor-pointer transition-all shadow-lg active:scale-95">
                    <span class="mr-2">📸</span> HACER FOTO (SCAN)
                </label>
                <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
            </div>
        </div>

        <p id="error-msg" class="text-red-400 text-xs mt-4 text-center hidden font-medium"></p>
    </div>

    <script>
        // CONFIGURACIÓN
        // Si tienes una API Key de Pokémon, pégala aquí. Si no, déjala vacía (limita a 100 peticiones)
        const POKEMON_API_KEY = ""; 

        async function buscarCartaPokemon(nombre) {
            const errorMsg = document.getElementById('error-msg');
            const cardImage = document.getElementById('card-image');
            const placeholderText = document.getElementById('placeholder-text');
            const loadingSpinner = document.getElementById('loading-spinner');
            const priceResult = document.getElementById('price-result');
            const priceValue = document.getElementById('price-value');

            // Limpiar estado previo
            errorMsg.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            placeholderText.classList.add('hidden');
            cardImage.classList.add('hidden');
            priceResult.classList.add('hidden');

            try {
                const response = await fetch(`https://api.pokemontcg.io/v2/cards?q=name:"${encodeURIComponent(nombre)}"`, {
                    headers: POKEMON_API_KEY ? { "X-Api-Key": POKEMON_API_KEY } : {}
                });
                
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    const carta = data.data[0]; // Cogemos la primera coincidencia
                    
                    // 1. Mostrar Imagen
                    cardImage.src = carta.images.large;
                    cardImage.classList.remove('hidden');

                    // 2. Mostrar Precio (buscamos el precio de Cardmarket)
                    const precio = carta.cardmarket?.prices?.averageSellPrice;
                    if (precio) {
                        priceValue.innerText = `${precio} €`;
                    } else {
                        priceValue.innerText = "N/A";
                    }
                    priceResult.classList.remove('hidden');

                } else {
                    errorMsg.innerText = "No se encontró ninguna carta con ese nombre.";
                    errorMsg.classList.remove('hidden');
                    placeholderText.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.innerText = "Error de conexión con la API.";
                errorMsg.classList.remove('hidden');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        // Función que se activa al darle al botón de buscar
        function ejecutarBusqueda() {
            const nombre = document.getElementById('manual-search').value;
            if (nombre) buscarCartaPokemon(nombre);
        }

        // Simulación de "Tras hacer la foto"
        document.getElementById('camera-input').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                alert("Foto capturada. En el siguiente paso (OCR), extraeremos el nombre automáticamente. Por ahora, escribe el nombre en el cuadro de texto para probar la API.");
            }
        });

        // Permitir buscar al pulsar "Enter"
        document.getElementById('manual-search').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') ejecutarBusqueda();
        });
    </script>
</body>
</html>
