:root {
  --bg:        #0d0f14;
  --surface:   #13161e;
  --surface2:  #1a1e2a;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.15);
  --text:      #e8e6e0;
  --muted:     #7a7870;
  --accent-pk: #f5c842;
  --accent-mt: #8b5cf6;
  --glow-pk:   rgba(245,200,66,0.18);
  --glow-mt:   rgba(139,92,246,0.18);
  --accent:    var(--accent-pk);
  --glow:      var(--glow-pk);
  --radius:    16px;
  font-family: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--glow), transparent 70%);
  pointer-events: none;
  transition: background 0.6s ease;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  width: 100%;
  max-width: 420px;
  padding: 28px;
  box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05) inset;
  max-height: 95vh;
  display: flex;
  flex-direction: column;
}

.header { text-align: center; margin-bottom: 24px; flex-shrink: 0; }
.logo {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--accent) 0%, #fff 60%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: background 0.5s ease;
}
.subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; letter-spacing: 0.03em; }

.game-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  flex-shrink: 0;
}
.game-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border: none; border-radius: 9px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.25s ease; background: transparent; color: var(--muted);
}
.game-btn.active-pokemon { background: rgba(245,200,66,0.12); color: var(--accent-pk); box-shadow: 0 0 0 1px rgba(245,200,66,0.3); }
.game-btn.active-magic { background: rgba(139,92,246,0.12); color: var(--accent-mt); box-shadow: 0 0 0 1px rgba(139,92,246,0.3); }

.dynamic-content {
  flex: 1;
  overflow-y: auto;
  min-height: 200px;
  margin-bottom: 16px;
  scrollbar-width: none;
}
.dynamic-content::-webkit-scrollbar { display: none; }

.display-wrap {
  position: relative; width: 100%; aspect-ratio: 2/3;
  border-radius: var(--radius); overflow: hidden;
  background: var(--surface2); border: 1px solid var(--border);
  display: none;
}
.display-wrap.visible { display: block; }
#card-image { width: 100%; height: 100%; object-fit: contain; display: block; animation: fadeIn 0.4s ease; }

.results-grid {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  animation: fadeIn 0.4s ease;
}
.results-grid.visible { display: grid; }

.result-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.2s, border-color 0.2s;
}
.result-item:hover { transform: translateY(-3px); border-color: var(--accent); }
.result-item img { width: 100%; aspect-ratio: 2/3; object-fit: contain; border-radius: 6px; margin-bottom: 8px; }
.result-item .res-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-item .res-set { font-size: 10px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-item .res-price { font-size: 13px; font-family: 'Cinzel', serif; font-weight: 700; color: var(--accent); }

.btn-back {
  display: none;
  width: 100%; padding: 10px; margin-bottom: 12px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  text-align: center;
}
.btn-back.visible { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

.placeholder {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  min-height: 200px;
}
.placeholder.hidden { display: none; }
.placeholder-icon { font-size: 40px; opacity: 0.3; }
.placeholder-text { font-size: 13px; text-align: center; max-width: 200px; line-height: 1.5; }

.spinner-wrap {
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 40px 0;
}
.spinner-wrap.visible { display: flex; }
.spin-ring {
  width: 40px; height: 40px; border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.spinner-text { font-size: 13px; color: var(--accent); font-weight: 500; text-align: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.price-box {
  display: none; text-align: center; margin-bottom: 16px; padding: 14px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; flex-shrink: 0;
}
.price-box.visible { display: block; }
.price-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 4px; }
.price-main { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1; }
.price-secondary { font-size: 13px; color: var(--muted); margin-top: 4px; }

.search-row { display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
.search-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.search-btn { background: var(--accent); border: none; border-radius: 10px; width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.camera-label {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
  font-size: 14px; font-weight: 500; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
}
.camera-label:hover { border-color: var(--accent); color: var(--accent); }

.error-msg { display: none; font-size: 12px; color: #f87171; text-align: center; margin-top: 10px; padding: 8px 12px; background: rgba(248,113,113,0.08); border-radius: 8px; border: 1px solid rgba(248,113,113,0.2); flex-shrink: 0; }
.error-msg.visible { display: block; }

body.mode-magic { --accent: var(--accent-mt); --glow: var(--glow-mt); }
body.mode-pokemon { --accent: var(--accent-pk); --glow: var(--glow-pk); }

  </div>

  <div class="price-box" id="price-box">
    <div class="price-label" id="price-card-name">Precio Cardmarket</div>
    <div class="price-main" id="price-main">—</div>
    <div class="price-secondary" id="price-secondary"></div>
  </div>

  <div class="search-row">
    <input type="text" id="search-input" class="search-input" placeholder="Nombre de la carta..." onkeypress="if(event.key==='Enter') ejecutarBusqueda()">
    <button class="search-btn" onclick="ejecutarBusqueda()">🔍</button>
  </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">

<script>
  const POKEMON_API_KEY = "";
  let juegoActual = 'pokemon';
  let ultimosResultados = [];

  function setGame(juego) {
    juegoActual = juego;
    const esMagic = juego === 'magic';
    document.body.classList.toggle('mode-magic', esMagic);
    document.body.classList.toggle('mode-pokemon', !esMagic);
    document.getElementById('btn-pokemon').className = 'game-btn' + (!esMagic ? ' active-pokemon' : '');
    document.getElementById('btn-magic').className   = 'game-btn' + (esMagic  ? ' active-magic'   : '');
    document.getElementById('subtitle').textContent = esMagic ? 'Magic: The Gathering · Busca y valora tus cartas' : 'Pokémon TCG · Busca y valora tus cartas';
    document.getElementById('search-input').placeholder = esMagic ? 'Ej: Black Lotus, Jace...' : 'Ej: Pikachu, Charizard...';
    resetUI();
  }

  function resetUI() {
    document.getElementById('placeholder').classList.remove('hidden');
    document.getElementById('spinner-wrap').classList.remove('visible');
    document.getElementById('results-grid').classList.remove('visible');
    document.getElementById('display-wrap').classList.remove('visible');
    document.getElementById('price-box').classList.remove('visible');
    document.getElementById('error-msg').classList.remove('visible');
    document.getElementById('btn-back').classList.remove('visible');
    ultimosResultados = [];
  }

  function mostrarCargando(texto = "Buscando cartas...") {
    resetUI();
    document.getElementById('placeholder').classList.add('hidden');
    document.getElementById('spinner-text').textContent = texto;
    document.getElementById('spinner-wrap').classList.add('visible');
  }

  function mostrarError(msg) {
    resetUI();
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-msg').classList.add('visible');
  }

  function renderizarLista(resultados) {
    document.getElementById('spinner-wrap').classList.remove('visible');
    const grid = document.getElementById('results-grid');
    grid.innerHTML = '';
    ultimosResultados = resultados;

    if (resultados.length === 1) {
      seleccionarCarta(0);
      return;
    }

    resultados.forEach((carta, index) => {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.onclick = () => seleccionarCarta(index);

      const sym = carta.moneda === 'usd' ? '$' : '€';
      const precioTxt = carta.precio ? `${parseFloat(carta.precio).toFixed(2)} ${sym}` : 'N/D';

      div.innerHTML = `
        <img src="${carta.imagenThumb || carta.imagen}" alt="${carta.nombre}">
        <div class="res-name">${carta.nombre}</div>
        <div class="res-set">${carta.set || 'Desconocido'}</div>
        <div class="res-price">${precioTxt}</div>
      `;
      grid.appendChild(div);
    });

    grid.classList.add('visible');
  }

  function seleccionarCarta(index) {
    const carta = ultimosResultados[index];
    document.getElementById('results-grid').classList.remove('visible');

    if (ultimosResultados.length > 1) {
      document.getElementById('btn-back').classList.add('visible');
    }

    const img = document.getElementById('card-image');
    img.src = carta.imagen;
    document.getElementById('display-wrap').classList.add('visible');

    const sym = carta.moneda === 'usd' ? '$' : '€';
    document.getElementById('price-card-name').textContent = `${carta.nombre} (${carta.set})`;
    document.getElementById('price-main').textContent = carta.precio ? `${parseFloat(carta.precio).toFixed(2)} ${sym}` : 'N/D';

    const secEl = document.getElementById('price-secondary');
    if (carta.precioFoil) {
      secEl.innerHTML = `Foil: <span style="color:var(--accent)">${parseFloat(carta.precioFoil).toFixed(2)} ${sym}</span>`;
    } else {
      secEl.textContent = carta.precio ? 'Precio medio' : 'Sin datos de venta';
    }

    document.getElementById('price-box').classList.add('visible');
  }

  function volverALista() {
    document.getElementById('display-wrap').classList.remove('visible');
    document.getElementById('price-box').classList.remove('visible');
    document.getElementById('btn-back').classList.remove('visible');
    document.getElementById('results-grid').classList.add('visible');
  }

  async function buscarPokemon(nombre) {
    const headers = POKEMON_API_KEY ? { "X-Api-Key": POKEMON_API_KEY } : {};
    const url = `https://api.pokemontcg.io/v2/cards?q=name:"${encodeURIComponent(nombre)}"&orderBy=-set.releaseDate`;
    const res  = await fetch(url, { headers });
    if (!res.ok) throw new Error(`Error HTTP ${res.status}`);
    const data = await res.json();
    if (!data.data || data.data.length === 0) throw new Error('No se encontró ninguna carta.');

    return data.data.map(carta => ({
      imagenThumb: carta.images.small,
      imagen: carta.images.large,
      nombre: carta.name,
      set: carta.set?.name,
      precio: carta.cardmarket?.prices?.averageSellPrice ?? carta.tcgplayer?.prices?.normal?.market ?? null,
      precioFoil: carta.tcgplayer?.prices?.holofoil?.market ?? null,
      moneda: 'eur'
    }));
  }

  async function buscarMagic(nombre) {
    const url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(nombre)}&unique=prints`;
    const res  = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if (data.object === 'error') throw new Error('Carta no encontrada en Scryfall.');

    return data.data.map(carta => {
      let imgThumb, imgLarge;
      if (carta.image_uris) {
        imgThumb = carta.image_uris.small;
        imgLarge = carta.image_uris.large || carta.image_uris.normal;
      } else if (carta.card_faces && carta.card_faces[0]?.image_uris) {
        imgThumb = carta.card_faces[0].image_uris.small;
        imgLarge = carta.card_faces[0].image_uris.large || carta.card_faces[0].image_uris.normal;
      }

      return {
        imagenThumb: imgThumb,
        imagen: imgLarge,
        nombre: carta.name,
        set: carta.set_name,
        precio: carta.prices?.eur ?? carta.prices?.usd ?? null,
        precioFoil: carta.prices?.eur_foil ?? null,
        moneda: carta.prices?.eur ? 'eur' : 'usd'
      };
    });
  }

  async function ejecutarBusqueda() {
    const nombre = document.getElementById('search-input').value.trim();
    if (!nombre) return;
    mostrarCargando("Buscando ediciones...");
    try {
      const resultados = juegoActual === 'magic' ? await buscarMagic(nombre) : await buscarPokemon(nombre);
      renderizarLista(resultados);
    } catch (err) {
      mostrarError(err.message || 'Error de conexión.');
    }
  }

  // --- OCR CON TESSERACT.JS ---
  document.getElementById('camera-input').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    mostrarCargando("Analizando imagen (OCR en proceso)...");

    try {
      const worker = await Tesseract.createWorker('eng+spa');
      const result = await worker.recognize(file);
      await worker.terminate();

      const textLines = result.data.lines
        .map(l => l.text.trim())
        .filter(t => t.length > 3);

      if (textLines.length > 0) {
        // BUG CORREGIDO: era "textLi\nnes[0]" (variable partida en dos líneas)
        const posibleNombre = textLines[0];
        document.getElementById('search-input').value = posibleNombre;
        ejecutarBusqueda();
      } else {
        mostrarError("No se pudo leer el nombre de la carta. ¿Hay muchos reflejos?");
      }
    } catch (error) {
      console.error(error);
      mostrarError("Error al procesar la imagen.");
    }
  });
</script>
